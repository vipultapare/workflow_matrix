name: Workflow for the different OS Checks

on:
  workflow_dispatch:

jobs:
  matrix_ex:
    strategy:
      matrix:
        version: [13,15,17]
        os: [ubuntu-latest,windows-latest]
    
    runs-on: $

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version:${{ matrix.version }}
      
      - name: Run the Node Version
        run: node --version